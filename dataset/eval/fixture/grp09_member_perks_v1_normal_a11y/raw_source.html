<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>grp09_member_perks_v1_normal_a11y</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef1f5;
      color: #1f2328;
      margin: 0;
      padding: 40px;
    }
    .modal {
      background: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 10px;
      max-width: 560px;
      margin: 0 auto;
      padding: 28px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    h1 { font-size: 20px; margin: 0; }
    p { font-size: 14px; color: #424a53; line-height: 1.5; }
    .consent-row {
      margin: 18px 0;
      padding: 12px;
      background: #f6f8fa;
      border-radius: 6px;
      font-size: 13px;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .btn-accept {
      background: #0b57d0;
      color: #ffffff;
      border: none;
      padding: 12px 22px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-decline-equal {
      background: #ffffff;
      color: #1f2328;
      border: 1px solid #595959;
      padding: 12px 22px;
      font-size: 15px;
      border-radius: 6px;
      cursor: pointer;
    }
    .decline-downplayed-accessible {
      color: #595959; /* >= 7:1 contrast on #ffffff (passes WCAG AA) */
      font-size: 11px;
      text-decoration: underline;
      background: none;
      border: none;
      padding: 2px 4px;
    }
    .decline-downplayed-lowcontrast {
      color: #b8b8b8; /* ~1.98:1 contrast on #ffffff (fails WCAG 1.4.3) */
      font-size: 11px;
      text-decoration: none;
      background: none;
      border: none;
      padding: 2px 4px;
    }
    .icon-btn {
      width: 32px;
      height: 32px;
      border: 1px solid #8c959f;
      background: #f6f8fa;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <section class="modal" role="dialog" aria-label="Loyalty Rewards Prompt">
      <div class="top-bar">
        <h1>Activate Double Points Today</h1>
        <button type="button" class="icon-btn"></button>
      </div>
      <p>Earn 2x reward points on every purchase this month.</p>
      <div class="consent-row">
        <label for="grp09_member_perks_cb1"><input id="grp09_member_perks_cb1" type="checkbox" /> Opt me into promotional partner campaigns and marketing offers</label>
      </div>
      <div class="actions">
        <button type="button" class="btn-accept">Activate Rewards</button>
        <button type="button" class="btn-decline-equal">Decline Offer</button>
      </div>
    </section>
  </main>
</body>
</html>
